<!doctype html><html><head><style>
:root { --c1: #00ff00; }
body { background: #ffffff; margin: 0; font-family: monospace; }
svg text { font-size: 14px; }
</style></head><body>
<svg width="780" height="360" viewBox="0 0 780 360">
  <rect x="20" y="20" width="200" height="80" fill="var(--c1)" stroke="#000"/>
  <text x="240" y="65" fill="#000">1: fill="var(--c1)" attr</text>
  <rect x="20" y="140" width="200" height="80" style="fill: var(--c1)" stroke="#000"/>
  <text x="240" y="185" fill="#000">2: style fill var(--c1)</text>
  <rect x="20" y="260" width="200" height="80" fill="#ff0000" stroke="#000"/>
  <text x="240" y="305" fill="#000">3: control fill #f00</text>
  <rect x="480" y="20" width="200" height="80" fill="color-mix(in srgb, var(--c1) 50%, #ff0000))" stroke="#000"/>
  <text x="500" y="130" fill="#000">4: attr color-mix var</text>
  <rect x="480" y="150" width="200" height="80" style="fill: color-mix(in srgb, var(--c1) 50%, #ff0000)" stroke="#000"/>
  <text x="500" y="260" fill="#000">5: style color-mix var</text>
</svg>
</body></html>
