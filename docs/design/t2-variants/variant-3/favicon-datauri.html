<!--
  T2 Вариант 3 — „Изцяло inline, без нови файлове"
  Фрагмент за <head> на apps/web/index.html (сега там няма нито favicon,
  нито theme-color → браузърът търси /favicon.ico на всяко отваряне).

  Поставяне: двата реда по-долу се copy/paste-ват в index.html, в <head>.
  Файлът тук е само артефакт за ревю — public/ НЕ се пипа.

  data-URI favicon: минимизиран (един ред, без whitespace) символ-само SVG.
  Кодиране: < → %3C, > → %3E, " → %22, # → %23, интервал → %20
  (round-trip валидиран с decodeURIComponent; дължина 864 символа).
  viewBox="25 12 188 188" = квадратен плотен кадър около символа
  (съдържание x 29–209 / y 40–173, центрирано, лек отстъп от ръбовете).
-->

<meta name="theme-color" content="#07131F" />
