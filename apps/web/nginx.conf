server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # компресия за текстовите активи (styles.css ~29KB -> ~7KB)
    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # fingerprint-ирани билд активи — неизменни
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # шрифтове: стабилни имена (без hash) — дълъг, но не immutable cache
    location ^~ /fonts/ {
        add_header Cache-Control "public, max-age=604800";
    }

    # favicon: стабилно име, сервира се директно (не през SPA fallback)
    location = /favicon.svg {
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
