<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220">
  <!-- MeshGate favicon — само символът „Mesh Triangle", без текст, без шрифтове (само пътища).
       Източник: фирменото лого 900x220, координатите са дословно запазени;
       символът е центриран в квадрат 220x220 чрез translate(-9 3.5)
       (bbox на съдържанието с щриховете: x 29..209, y 40..173 -> център 119,106.5).
       Плоча: тъмен #100D14 (= токен bg-canvas) със заоблени ъгли и фина акцентна рамка,
       защото favicon се рисува върху произволен фон на таб-а — светъл таб измива
       циановите щрихи (#22D3D9 върху ~#DEE1E6 е ~1.6:1 контраст); тъмната плоча
       гарантира контраст и в светъл, и в тъмен режим, а рамката 0.25 очертава
       ръба, когато самият таб е почти черен. Падинг ~20px/10% от страната,
       за да не «залипва» символа в закръглените ъгли на таб-контейнера.
       Четимост: щрих 12/220 = 5.5% -> 1.31px при 24px (топбар), 0.87px при 16px (таб);
       силуетът на двата триъгълника носи разпознаването, възлите са акцент. -->
  <title>MeshGate</title>
  <rect x="2" y="2" width="216" height="216" rx="52"
        fill="#100D14" stroke="#22D3D9" stroke-opacity="0.25" stroke-width="2"/>
  <g transform="translate(-9 3.5)">
    <g fill="none" stroke="#22D3D9" stroke-linecap="square">
      <path d="M35 166 L102 48 L170 166" stroke-width="12"/>
      <path d="M73 166 L137 58 L202 166" stroke-width="12"/>
      <path d="M73 119 L48 166 M73 119 L102 166" stroke-width="4"/>
    </g>
    <g fill="#22D3D9">
      <circle cx="102" cy="48" r="8"/>
      <circle cx="137" cy="58" r="7"/>
      <circle cx="73" cy="119" r="10"/>
      <circle cx="170" cy="166" r="7"/>
      <circle cx="202" cy="166" r="7"/>
    </g>
  </g>
</svg>
